name: Deploy a alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: false

env:
  ALWAYSDATA_HOST: ${{ vars.ALWAYSDATA_HOST || 'ssh-jemstore.alwaysdata.net' }}
  ALWAYSDATA_USER: ${{ vars.ALWAYSDATA_USER || 'jemstore' }}
  ALWAYSDATA_PATH: /home/jemstore/JEM-Store

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, openssl, curl, dom, filter, hash, session, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias de Composer (incluye dev, necesarias para los tests)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar assets (Vite)
        run: npm run build

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      # --------------------------------------------------
      # Si algo de aquí para arriba falla, el job se detiene
      # y el paso de despliegue de abajo NUNCA se ejecuta.
      # --------------------------------------------------
      - name: Correr pruebas automatizadas
        run: php artisan test

      - name: Reinstalar dependencias de Composer solo para producción
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Fijar el host key de alwaysdata (evita MITM)
        run: |
          cat > ~/.ssh/known_hosts <<'EOF'
          ssh-jemstore.alwaysdata.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILFC808n0lKFAA1QsutTFWO+pNyuUo7I1FlCqLn60uO2
          ssh-jemstore.alwaysdata.net ssh-rsa 
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Crear carpetas de storage en el servidor (si no existen)
        run: |
          ssh -i ~/.ssh/deploy_key "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}" \
            "mkdir -p ${ALWAYSDATA_PATH}/storage/app/public/products \
                      ${ALWAYSDATA_PATH}/storage/framework/cache/data \
                      ${ALWAYSDATA_PATH}/storage/framework/sessions \
                      ${ALWAYSDATA_PATH}/storage/framework/views \
                      ${ALWAYSDATA_PATH}/storage/framework/testing \
                      ${ALWAYSDATA_PATH}/storage/logs \
                      ${ALWAYSDATA_PATH}/bootstrap/cache"

      - name: Desplegar por rsync/SSH a alwaysdata
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='database/database.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            ./ "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}:${ALWAYSDATA_PATH}/"

      - name: Comandos post-deploy (migraciones, storage link, imágenes, cachés)
        run: |
          ssh -i ~/.ssh/deploy_key "${ALWAYSDATA_USER}@${ALWAYSDATA_HOST}" '
            set -e
            cd '"${ALWAYSDATA_PATH}"'
            php artisan migrate --force
            php artisan storage:link || true
            php artisan products:sync-images
            php artisan optimize:clear
            php artisan optimize
          '

      - name: Limpiar clave SSH temporal del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
